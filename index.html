<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bibs Band · Music Library</title>

  <!-- Apple Data -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-touch-fullscreen" content="yes" />
  <meta name="apple-mobile-web-app-title" content="RockBand" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="mask-icon" href="safari-pinned-tab.svg" color="#5bbad5">
  <link rel="shortcut icon" href="favicon.ico">
  <meta name="msapplication-TileColor" content="#06121f">
  <meta name="msapplication-config" content="browserconfig.xml">
  <meta name="theme-color" content="#06121f">

  <link rel="stylesheet" type="text/css" href="assets/css/styles.css">
  <script src="assets/js/main.js" defer></script>
</head>

<body>
  <div class="app">
    <header class="library-header">
      <div class="library-header__top">
        <div class="brand">
          <span class="brand__eyebrow">Bibs Band</span>
          <h1 class="library-title">Music Library</h1>
          <p class="library-subtitle" id="sort-summary">Sorted by Artist</p>
        </div>
        <div class="library-total">
          <span class="library-total__count" id="song-count">0</span>
          <span class="library-total__label" id="song-count-label">Songs</span>
          <span class="library-total__extra" id="song-count-extra" hidden></span>
        </div>
      </div>

      <div class="toolbar">
        <div class="search">
          <span class="icon icon--search search__icon" aria-hidden="true"></span>
          <input id="search-bar" type="text" inputmode="search" placeholder="Search songs, artists, sources"
            autocomplete="off" spellcheck="false" aria-label="Search songs">
          <button type="button" class="search__clear" id="search-clear" aria-label="Clear search" hidden>
            <span class="icon icon--close" aria-hidden="true"></span>
          </button>
        </div>

        <button type="button" class="btn btn--accent" id="filter-toggle" aria-expanded="false"
          aria-controls="filter-panel">
          <span class="icon icon--filter" aria-hidden="true"></span>
          <span class="btn__label">Filters</span>
          <span class="badge" id="filter-badge" hidden>0</span>
        </button>

        <button type="button" class="btn" id="random-song">
          <span class="icon icon--random" aria-hidden="true"></span>
          <span class="btn__label">Random</span>
        </button>
      </div>

      <div class="active-filters" id="active-filters" hidden></div>
    </header>

    <main class="library" id="library">
      <div class="song-list" id="song-list" role="list" aria-label="Songs"></div>

      <div class="loader" id="loader">
        <span class="loader__ring" aria-hidden="true"></span>
        <span id="loader-text">Loading library…</span>
      </div>

      <div class="empty" id="empty" hidden>
        <span class="icon icon--music empty__icon" aria-hidden="true"></span>
        <p class="empty__title">No songs found</p>
        <p class="empty__text">Try a different search, or loosen the filters.</p>
        <button type="button" class="btn" id="empty-reset">Reset filters</button>
      </div>

      <div class="sentinel" id="sentinel" aria-hidden="true"></div>
    </main>
  </div>

  <div class="scrim" id="scrim" hidden></div>

  <aside class="filter-panel" id="filter-panel" role="dialog" aria-modal="true" aria-labelledby="filter-panel-title"
    aria-hidden="true">
    <div class="filter-panel__head">
      <h2 class="filter-panel__title" id="filter-panel-title">Filters</h2>
      <button type="button" class="icon-btn" id="filter-close" aria-label="Close filters">
        <span class="icon icon--close" aria-hidden="true"></span>
      </button>
    </div>

    <div class="filter-panel__body">
      <button type="button" class="filter-row" data-cycle="source">
        <span class="filter-row__label">Song source</span>
        <span class="filter-row__value" id="value-source">All Songs</span>
      </button>
      <button type="button" class="filter-row" data-cycle="instrument">
        <span class="filter-row__label">Difficulty by</span>
        <span class="filter-row__value" id="value-instrument">Band</span>
      </button>
      <button type="button" class="filter-row" data-cycle="minLevel">
        <span class="filter-row__label">Minimum difficulty</span>
        <span class="filter-row__value" id="value-minLevel">Any</span>
      </button>
      <button type="button" class="filter-row" data-cycle="sort">
        <span class="filter-row__label">Sort by</span>
        <span class="filter-row__value" id="value-sort">Artist</span>
      </button>

      <p class="filter-panel__hint">Tap a row — or press ← / → — to change its value.</p>

      <ul class="legend" aria-label="Difficulty legend">
        <li class="legend__item">
          <span class="legend__pips pips" style="--fill:100%"></span>
          <span>Difficulty meter</span>
        </li>
        <li class="legend__item">
          <span class="legend__stars rating" style="--fill:100%"></span>
          <span>Band stars</span>
        </li>
        <li class="legend__item">
          <span class="icon icon--devil legend__devil" aria-hidden="true"></span>
          <span>Devil tier (6)</span>
        </li>
      </ul>
    </div>

    <div class="filter-panel__foot">
      <button type="button" class="btn" id="filter-reset">Reset</button>
      <button type="button" class="btn btn--primary" id="filter-done">
        Show <span id="filter-done-count">0</span> songs
      </button>
    </div>
  </aside>
</body>

</html>
